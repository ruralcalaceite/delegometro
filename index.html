<style>
/* Layout: one narrow column built for a phone held in one hand. A swipe deck is the centrepiece; display-serif numerals and mono labels carry the personality. */
:root {
  --bg: #F0F1ED;
  --surface: #FBFBF8;
  --fg: #121715;
  --muted: #58625D;
  --line: #D3D7CF;
  --accent: #0B5D4B;
  --accent-ink: #F5F8F5;
  --accent-soft: #DDEAE3;
  --danger: #B3261E;
  --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1210; --surface: #161C19; --fg: #ECEFEA; --muted: #9AA59F; --line: #28312D;
    --accent: #5DCFA6; --accent-ink: #08130F; --accent-soft: #1B2823; --danger: #FF8F86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1210; --surface: #161C19; --fg: #ECEFEA; --muted: #9AA59F; --line: #28312D;
  --accent: #5DCFA6; --accent-ink: #08130F; --accent-soft: #1B2823; --danger: #FF8F86;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 540px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

.lang { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lang button {
  font: 500 12px var(--font-mono); letter-spacing: .08em; background: transparent; color: var(--muted);
  border: 0; padding: 8px 12px; min-height: 36px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.screen { display: flex; flex-direction: column; gap: 22px; }
.eyebrow, .mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: clamp(34px, 9.5vw, 50px); line-height: 1.04; }
h1 em, .accent { font-style: italic; color: var(--accent); }
h2 { font-size: clamp(30px, 8vw, 40px); line-height: 1.08; }
h3 { font-size: 28px; line-height: 1.12; }
h1:focus, h2:focus { outline: none; }
.lead { margin: 0; color: var(--muted); font-size: 17px; max-width: 46ch; }
.fine, .help { margin: 0; font-size: 13px; color: var(--muted); }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend, label.lbl { font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 10px; display: block; }
.group { display: flex; flex-direction: column; gap: 10px; }

.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { position: relative; display: block; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span {
  display: flex; align-items: center; min-height: 52px; padding: 8px 14px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); font-size: 15px; line-height: 1.25;
}
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 500; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.rate { display: flex; gap: 8px; }
input[type="number"], input[type="text"], input[type="email"], select {
  font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  min-height: 50px; padding: 0 14px; min-width: 0; width: 100%;
}
.rate input { font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; flex: 1 1 auto; }
.rate select { flex: 0 0 112px; width: 112px; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.preset {
  font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; background: transparent; color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; min-height: 34px; cursor: pointer;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; text-align: center; gap: 8px;
  min-height: 52px; padding: 10px 22px; border-radius: 6px; border: 1px solid var(--fg); font: 600 16px var(--font-body);
  line-height: 1.2; cursor: pointer; text-decoration: none; color: var(--fg); background: transparent;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); }
.btn.keep { border-color: var(--fg); background: var(--surface); }
.btn.give { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.btn:hover { filter: brightness(1.06); }

      moneyKeep: function (m, y) { return 'Your time on this is worth ≈ ' + m + ' a month · ' + y + ' a year'; },
      daysKeep: function (d) { return 'That is ' + d + ' eight-hour working days every month doing it all yourself.'; },
      zeroText: 'Either you already have support, or letting go is the hard part. If it is the second, that is exactly the conversation worth having.',
      perMonth: 'h / mo',
      money: function (m, y) { return '≈ ' + m + ' a month · ' + y + ' a year'; },
      days: function (d) { return 'That is ' + d + ' eight-hour working days every month.'; },
      breakdown: 'Where your time goes',
      services: 'What I would take off your plate',
      revealKicker: 'And guess what?', revealMain: 'I can help you with <strong>every single one.</strong>', revealWink: 'Yes, even the impossible table.',
      ctaTitle: 'Let me tell you what I would hand off first',
      ctaText: 'I will email you within 24 hours with your first 3 tasks to hand off, based on your result. No calls, no strings.',
      ctaTitleNow: 'Let’s book your call',
      ctaTextNow: 'You said you want to start as soon as possible. Pick a slot and we’ll talk it through in 30 minutes, no strings.',
      book: 'Book a call · 30 min',
      costLess: 'And delegating it costs less than keeping it on your plate.',
      plan: 'Send me my first 3 tasks', wa: 'Prefer to write now? WhatsApp',
      planDone: function (e) { return 'Done. I will write to ' + e + ' within 24 hours.'; },
      waMsg: function (nm, n, h) { return 'Hi Laia, I am ' + nm + '. I did the Delegometer: ' + (n ? 'I hand off ' + n + ' tasks, ' + h + ' h a month' : 'I am keeping everything') + '. Can we talk?'; },
      copy: 'Copy my result', again: 'Start over', copied: 'Copied',
      share: function (n, h, url) { return 'My Delegometer: I hand off ' + n + ' tasks, ' + h + ' h a month. What about you? ' + url; },
      areas: { travel: 'Travel & logistics', agenda: 'Calendar & admin', events: 'Events & gifting', home: 'Home & property', life: 'Personal life' },
      svc: {
        travel: 'Bookings, itineraries and team trips, from the first search to the return flight.',
        agenda: 'Calendar, inbox, expenses and paperwork under control.',
        events: 'Dinners, celebrations and gifts handled with taste.',
        home: 'Suppliers, renovations and rentals handled without you having to be there.',
        life: 'Appointments, bookings and personal errands that never slip.'
      },
      profiles: { founder: 'Founder / startup', exec: 'Executive', owner: 'Business owner', wealth: 'HNWI / family office' }
    }
  };

  var RM = false;
  try { RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var S = { lang: 'en', screen: 'intro', profile: 'founder', rate: 100, currency: 'EUR', i: 0, answers: [], lead: null, busy: false };

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function T() { return TXT[S.lang]; }
  function sumHours() { var s = 0; for (var k = 0; k < S.answers.length; k++) if (S.answers[k]) s += TASKS[k].h; return s; }
  function countYes() { var c = 0; for (var k = 0; k < S.answers.length; k++) if (S.answers[k]) c++; return c; }
  function fmtMoney(v) {
    try { return new Intl.NumberFormat(S.lang === 'es' ? 'es-ES' : 'en-US', { style: 'currency', currency: S.currency, maximumFractionDigits: 0 }).format(v); }
    catch (e) { return Math.round(v) + ' ' + S.currency; }
  }
  function fmtNum(v, d) {
    try { return new Intl.NumberFormat(S.lang === 'es' ? 'es-ES' : 'en-US', { maximumFractionDigits: d || 0 }).format(v); }
    catch (e) { return String(v); }
  }

  function detectLang() {
    try {
      var h = (location.hash || '').replace('#', '').toLowerCase();
      if (h === 'es' || h === 'en') return h;
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'es' || q === 'en') return q;
      var n = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      if (/^(es|ca)/i.test(n)) return 'es';
    } catch (e) {}
    return 'en';
  }

  function applyStatic() {
    var t = T();
    document.documentElement.lang = S.lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (n) { var v = t[n.getAttribute('data-i18n')]; if (typeof v === 'string') n.textContent = v; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-html]'), function (n) { var v = t[n.getAttribute('data-i18n-html')]; if (typeof v === 'string') n.innerHTML = v; });
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === S.lang ? 'true' : 'false'); });
  }

  function show(name, focusId) {
    S.screen = name;
    ['intro', 'play', 'gate', 'result'].forEach(function (s) { $('#s-' + s).hidden = (s !== name); });
    try { window.scrollTo(0, 0); } catch (e) {}
    if (focusId) { var f = $(focusId); if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } } }
  }

  function renderPresets() {
    var box = $('#presets'); box.innerHTML = '';
    [50, 100, 200, 500].forEach(function (v) {
      var b = el('button', 'preset', String(v)); b.type = 'button';
      b.addEventListener('click', function () { $('#rate').value = v; });
      box.appendChild(b);
    });
  }

  function renderPlay() {
    var t = T();
    if (S.i >= N) return;
    var task = TASKS[S.i], copy = task[S.lang];
    $('#progressText').textContent = String(S.i + 1).padStart(2, '0') + ' / ' + N;
    $('#handedText').textContent = t.handed + ': ' + sumHours() + ' ' + t.unit;
    $('#progressFill').style.width = (S.i / N * 100) + '%';
    $('#cardArea').textContent = t.areas[task.area];
    $('#cardTitle').textContent = copy[0];
    $('#cardDesc').textContent = copy[1];
    $('#cardHours').textContent = '≈ ' + task.h;
    $('#cardUnit').textContent = t.cardUnit;
    $('#noBtn').textContent = '← ' + t.no;
    $('#yesBtn').textContent = t.yes + ' →';
    $('#undoBtn').textContent = t.undo;
    $('#undoBtn').disabled = S.i === 0;
    $('#live').textContent = (S.i + 1) + '/' + N + '. ' + copy[0];
  }

  function resetCard() {
    var c = $('#card');
    c.style.transition = 'none'; c.style.transform = ''; c.style.opacity = '1';
    $('#card .stamp.yes').style.opacity = 0; $('#card .stamp.no').style.opacity = 0;
  }

  function decide(yes) {
    if (S.busy || S.screen !== 'play' || S.i >= N) return;
    S.busy = true;
    S.answers[S.i] = yes;
    var c = $('#card');
    var done = function () {
      S.i++; resetCard(); S.busy = false;
      if (S.i >= N) { goGate(); } else { renderPlay(); }
    };
    if (RM) { done(); return; }
    c.style.transition = 'transform .22s ease, opacity .22s ease';
    c.style.transform = 'translateX(' + (yes ? 120 : -120) + '%) rotate(' + (yes ? 14 : -14) + 'deg)';
    c.style.opacity = '0';
    setTimeout(done, 230);
  }

  function undo() {
    if (S.busy || S.i === 0) return;
    S.i--; S.answers.length = S.i; resetCard(); renderPlay();
  }

  function setupSwipe() {
    var c = $('#card'), startX = 0, dx = 0, drag = false;
    c.addEventListener('pointerdown', function (e) {
      if (S.busy) return;
      drag = true; startX = e.clientX; dx = 0;
      try { c.setPointerCapture(e.pointerId); } catch (err) {}
      c.style.transition = 'none';
    });
    c.addEventListener('pointermove', function (e) {
      if (!drag) return;
      dx = e.clientX - startX;
      c.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
      var k = Math.min(1, Math.abs(dx) / 80);
      $('#card .stamp.yes').style.opacity = dx > 0 ? k : 0;
      $('#card .stamp.no').style.opacity = dx < 0 ? k : 0;
    });
    function end() {
      if (!drag) return;
      drag = false;
      if (dx > 90) { decide(true); }
      else if (dx < -90) { decide(false); }
      else {
        c.style.transition = RM ? 'none' : 'transform .18s ease';
        c.style.transform = '';
        $('#card .stamp.yes').style.opacity = 0; $('#card .stamp.no').style.opacity = 0;
      }
    }
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
  }

  function goGate() {
    var t = T();
    $('#gateText').textContent = t.gateText(countYes());
    show('gate', '#gateTitle');
  }

  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

  function onGateSubmit(e) {
    e.preventDefault();
    var t = T();
    var name = $('#f-name').value.trim(), email = $('#f-email').value.trim();
    $('#e-name').textContent = name ? '' : t.errName;
    $('#e-email').textContent = validEmail(email) ? '' : t.errEmail;
    if (!name) { $('#f-name').focus(); return; }
    if (!validEmail(email)) { $('#f-email').focus(); return; }
    var ids = [];
    for (var k = 0; k < S.answers.length; k++) if (S.answers[k]) ids.push(TASKS[k].id);
    S.lead = {
      action: 'lead', name: name, email: email, start: $('#f-start').value, lang: S.lang, profile: S.profile,
      hourValue: S.rate, currency: S.currency, hoursPerMonth: sumHours(), tasks: ids, at: new Date().toISOString()
    };
    submitLead(S.lead);
    renderResult();
    show('result', '#resTitle');
  }

  function submitLead(lead) {
    if (!WEBHOOK_URL) return;
    try {
      fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lead), keepalive: true }).catch(function () {});
    } catch (e) {}
  }

  function renderResult() {
    var t = T(), hours = sumHours(), n = countYes();
    var fig = $('#resFigure'), br = $('#resBreakdown'), sv = $('#resServices');
    fig.innerHTML = ''; br.innerHTML = ''; sv.innerHTML = '';
    $('#resEyebrow').textContent = (S.lead ? S.lead.name + ' · ' : '') + t.profiles[S.profile];
    $('#copyStatus').textContent = '';
    $('#shareBox').hidden = true;
    $('#copyBtn').hidden = (hours === 0);
    $('#planBtn').disabled = !!S.planSent;
    $('#planStatus').textContent = (S.planSent && S.lead) ? t.planDone(S.lead.email) : '';
    $('#waBtn').setAttribute('href', 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t.waMsg(S.lead ? S.lead.name : '', n, hours)));

    // Warmest lead ("as soon as possible"): lead with the Calendly call, keep the email as the secondary option.
    var urgent = !!(S.lead && S.lead.start === 'now');
    var calBtn = $('#calBtn');
    calBtn.setAttribute('href', CALENDLY);
    calBtn.textContent = t.book;
    calBtn.hidden = !urgent;
    $('#planBtn').className = urgent ? 'btn ghost' : 'btn primary';
    var ctaH = document.querySelector('.cta h3[data-i18n="ctaTitle"]');
    var ctaP = document.querySelector('.cta p[data-i18n="ctaText"]');
    if (ctaH) ctaH.textContent = urgent ? t.ctaTitleNow : t.ctaTitle;
    if (ctaP) ctaP.textContent = urgent ? t.ctaTextNow : t.ctaText;

    if (hours === 0) {
      var all = TASKS.reduce(function (sum, k) { return sum + k.h; }, 0), cost = all * S.rate;
      $('#resTitle').textContent = t.zeroTitle;
      var bigZ = el('div', 'big');
      bigZ.appendChild(el('span', 'n', fmtNum(all)));
      bigZ.appendChild(el('span', 'u', t.perMonth));
      fig.appendChild(bigZ);
      fig.appendChild(el('p', 'money', t.moneyKeep(fmtMoney(cost), fmtMoney(cost * 12))));
      fig.appendChild(el('p', 'days', t.daysKeep(fmtNum(all / 8, 1))));
      fig.appendChild(el('p', 'days', t.zeroText));
      return;
    }
    $('#resTitle').textContent = t.headlines[S.profile];

    var money = hours * S.rate, big = el('div', 'big');
    big.appendChild(el('span', 'n', fmtNum(hours)));
    big.appendChild(el('span', 'u', t.perMonth));
    fig.appendChild(big);
    fig.appendChild(el('p', 'money', t.money(fmtMoney(money), fmtMoney(money * 12))));
    fig.appendChild(el('p', 'days', t.days(fmtNum(hours / 8, 1))));
    fig.appendChild(el('p', 'money', t.costLess));

    var rows = AREAS.map(function (a) {
      var sel = 0, tot = 0;
      TASKS.forEach(function (task, k) { if (task.area === a) { tot += task.h; if (S.answers[k]) sel += task.h; } });
      return { a: a, sel: sel, tot: tot };
    }).filter(function (r) { return r.sel > 0; }).sort(function (x, y) { return y.sel - x.sel; });

    br.appendChild(el('h3', null, t.breakdown));
    var ul = el('ul', 'rows');
    rows.forEach(function (r) {
      var li = el('li'), top = el('div', 'row-top');
      top.appendChild(el('span', null, t.areas[r.a]));
      top.appendChild(el('span', 'v', r.sel + ' ' + t.unit));
      var track = el('div', 'track'), fill = el('span');
      fill.style.width = (r.sel / r.tot * 100) + '%';
      track.appendChild(fill); li.appendChild(top); li.appendChild(track); ul.appendChild(li);
    });
    br.appendChild(ul);

    sv.appendChild(el('h3', null, t.services));
    var sl = el('ul', 'svc');
    rows.forEach(function (r) {
      var li = el('li');
      li.appendChild(el('strong', null, t.areas[r.a]));
      li.appendChild(el('span', null, t.svc[r.a]));
      sl.appendChild(li);
    });
    sv.appendChild(sl);
  }

  function copyShare() {
    var t = T(), url = '';
    try { url = location.href.split('#')[0] + '#' + S.lang; } catch (e) {}
    var text = t.share(countYes(), sumHours(), url);
    var done = function () { $('#copyStatus').textContent = t.copied; $('#shareBox').hidden = true; };
    var fallback = function () { var b = $('#shareBox'); b.hidden = false; b.value = text; b.focus(); b.select(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  function restart() {
    S.i = 0; S.answers = []; S.lead = null; S.busy = false; S.planSent = false;
    $('#f-name').value = ''; $('#f-email').value = ''; $('#e-name').textContent = ''; $('#e-email').textContent = '';
    show('intro', '#introTitle');
  }

  function renderCurrent() {
    applyStatic();
    if (S.screen === 'play') renderPlay();
    if (S.screen === 'gate') $('#gateText').textContent = T().gateText(countYes());
    if (S.screen === 'result') renderResult();
  }

  function setLang(l) {
    S.lang = l;
    try { history.replaceState(null, '', '#' + l); } catch (e) {}
    renderCurrent();
  }

  function init() {
    S.lang = detectLang();
    renderPresets();
    applyStatic();
    setupSwipe();

    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
      b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="profile"]'), function (r) {
      r.addEventListener('change', function () { if (r.checked) S.profile = r.value; });
    });
    $('#currency').addEventListener('change', function (e) { S.currency = e.target.value; });
    $('#startBtn').addEventListener('click', function () {
      var r = Number($('#rate').value);
      if (!(r > 0)) { r = 100; $('#rate').value = r; }
      S.rate = r; S.currency = $('#currency').value;
      S.i = 0; S.answers = []; S.busy = false;
      resetCard(); renderPlay(); show('play');
    });
    $('#yesBtn').addEventListener('click', function () { decide(true); });
    $('#noBtn').addEventListener('click', function () { decide(false); });
    $('#undoBtn').addEventListener('click', undo);
    $('#gateForm').addEventListener('submit', onGateSubmit);
    $('#planBtn').addEventListener('click', function () {
      if (S.planSent || !S.lead) return;
      S.planSent = true;
      submitLead(Object.assign({}, S.lead, { action: 'plan_requested' }));
      $('#planBtn').disabled = true;
      $('#planStatus').textContent = T().planDone(S.lead.email);
    });
    $('#copyBtn').addEventListener('click', copyShare);
    $('#againBtn').addEventListener('click', restart);
    document.addEventListener('keydown', function (e) {
      if (S.screen !== 'play') return;
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); decide(true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); decide(false); }
    });
    window.addEventListener('hashchange', function () {
      var h = (location.hash || '').replace('#', '').toLowerCase();
      if ((h === 'es' || h === 'en') && h !== S.lang) { S.lang = h; renderCurrent(); }
    });
  }

  init();
})();
</script>

</body>
</html>
